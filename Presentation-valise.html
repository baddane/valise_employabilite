<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valise de l'expert en employabilité</title>
<meta name="description" content="Boîte à outils professionnelle du conseil en emploi : 16 modules, fiches, grilles, guides et tableaux de bord — diagnostic, accompagnement, placement et pilotage d'agence.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b4f55'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%23e0a850'/%3E%3Crect x='8' y='16' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:light;
    --ink:#12211f; --paper:#f4f6f5; --card:#ffffff; --card-2:#eef2f1;
    --line:#d8e0dd; --muted:#5a6b67;
    --teal:#0b4f55; --teal-2:#0e6b6f; --teal-soft:#e2edec;
    --amber:#b9791f; --amber-soft:#f5e8d3; --mark:#fbe3a6;
    --star:#0b4f55; --star-empty:#c3d0cd;
    --shadow:0 1px 2px rgba(16,40,38,.06),0 8px 24px rgba(16,40,38,.06);
    --radius:14px; --top:58px; --side:290px;
    --serif:"Palatino Linotype","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ink:#e7efed; --paper:#0c1615; --card:#132220; --card-2:#0f1c1b;
      --line:#25403c; --muted:#9fb2ad;
      --teal:#4fb9b6; --teal-2:#6fd0cc; --teal-soft:#12302e;
      --amber:#e0a850; --amber-soft:#2a2113; --mark:#5a4415;
      --star:#4fb9b6; --star-empty:#2c4643;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e7efed; --paper:#0c1615; --card:#132220; --card-2:#0f1c1b;
    --line:#25403c; --muted:#9fb2ad; --teal:#4fb9b6; --teal-2:#6fd0cc;
    --teal-soft:#12302e; --amber:#e0a850; --amber-soft:#2a2113; --mark:#5a4415;
    --star:#4fb9b6; --star-empty:#2c4643;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{scroll-padding-top:calc(var(--top) + 16px)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding-inline:24px}
  a{color:inherit}
  img{max-width:100%}
  [hidden]{display:none!important}
  code{font-family:var(--mono);font-size:.86em;background:var(--teal-soft);color:var(--teal);padding:1px 6px;border-radius:5px}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px)}
  .topbar .bar{display:flex;align-items:center;gap:14px;height:var(--top);padding-inline:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
  .brand .mk{width:26px;height:26px;border-radius:7px;background:var(--teal);position:relative;flex:none}
  .brand .mk::after{content:"";position:absolute;left:7px;right:7px;top:8px;height:3px;border-radius:2px;background:var(--amber)}
  .brand .mk::before{content:"";position:absolute;left:7px;right:7px;top:15px;height:3px;border-radius:2px;background:#fff;opacity:.85}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;
    height:34px;min-width:34px;padding:0 10px;font-size:.8rem;cursor:pointer;font-family:var(--mono);display:inline-grid;place-items:center}
  .icon-btn:hover{color:var(--teal);border-color:var(--teal)}
  #menu{display:none;font-size:1.05rem;font-family:var(--sans)}
  .topnav{display:flex;gap:18px;font-size:.86rem;color:var(--muted);margin-left:8px}
  .topnav a{text-decoration:none}.topnav a:hover{color:var(--teal)}
  .search{position:relative;flex:1;max-width:460px;margin-left:auto}
  .search input{width:100%;height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:0 40px 0 34px;font:inherit;font-size:.88rem}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .search .lens{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.9rem}
  .search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.7rem;
    color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--card-2)}
  .results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.18);max-height:min(70vh,560px);overflow:auto;padding:6px;z-index:50}
  .sr{display:block;text-decoration:none;padding:10px 12px;border-radius:9px}
  .sr:hover,.sr.sel{background:var(--teal-soft)}
  .sr-m{display:block;font-family:var(--mono);font-size:.68rem;color:var(--amber);letter-spacing:.06em}
  .sr-t{display:block;font-weight:650;font-size:.9rem;margin:1px 0 3px}
  .sr-s{display:block;font-size:.8rem;color:var(--muted);line-height:1.45}
  .sr-none{padding:14px;color:var(--muted);font-size:.88rem}
  @media(max-width:1180px){.topnav{display:none}}
  @media(max-width:560px){.brand .txt{display:none}.search kbd{display:none}.search input{padding-right:12px}}

  /* ---------- shell : barre latérale + contenu ---------- */
  .shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
  .side{position:sticky;top:var(--top);height:calc(100vh - var(--top));height:calc(100dvh - var(--top));
    overflow:auto;border-right:1px solid var(--line);background:var(--card-2);padding:16px 12px 40px;
    overscroll-behavior:contain;scrollbar-width:thin}
  .s-link,.s-doc{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:8px;color:var(--ink)}
  .s-link{padding:7px 10px;font-size:.88rem;font-weight:550}
  .s-link:hover,.s-doc:hover{background:var(--teal-soft);color:var(--teal)}
  .s-link.on,.s-doc.on{background:var(--teal);color:#fff}
  :root[data-theme="dark"] .s-link.on,:root[data-theme="dark"] .s-doc.on{color:#06201f}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-link.on,:root:not([data-theme="light"]) .s-doc.on{color:#06201f}}
  .s-ic{width:20px;text-align:center;color:var(--amber);flex:none}
  .s-link.on .s-ic{color:inherit}
  .s-group{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    margin:20px 10px 6px}
  .s-mod>summary{list-style:none;display:flex;align-items:center;position:relative;cursor:pointer;border-radius:8px}
  .s-mod>summary::-webkit-details-marker{display:none}
  .s-mod>summary::after{content:"›";position:absolute;right:10px;color:var(--muted);transition:transform .15s;pointer-events:none}
  .s-mod[open]>summary::after{transform:rotate(90deg)}
  .s-mod>summary .s-link{flex:1;padding-right:26px;font-weight:500}
  .s-num{font-family:var(--mono);font-size:.72rem;color:var(--amber);width:20px;flex:none;text-align:center}
  .s-link.on .s-num{color:inherit}
  .s-docs{margin:2px 0 8px 20px;padding-left:10px;border-left:1px solid var(--line)}
  .s-doc{padding:5px 10px;font-size:.8rem;color:var(--muted);line-height:1.35}
  .s-file{font-family:var(--mono);font-size:.74rem;color:var(--teal)}
  .scrim{display:none}
  main#app{min-width:0;outline:none}

  @media(max-width:1024px){
    .shell{grid-template-columns:minmax(0,1fr)}
    #menu{display:inline-grid}
    .side{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(86vw,320px);z-index:35;
      transform:translateX(-100%);transition:transform .22s ease;box-shadow:none;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
    body.drawer .side{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.2)}
    body.drawer .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35)}
  }

  /* ---------- boutons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;
    text-decoration:none;border-radius:9px;padding:7px 14px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
  :root[data-theme="dark"] .btn{color:#06201f}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06201f}}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--teal);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--teal);background:var(--teal-soft)}
  .btn.sm{padding:4px 10px;font-size:.74rem;font-family:var(--mono)}

  /* ---------- hero (accueil) ---------- */
  .hero{padding:64px 0 40px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:14px}
  .hero .eyebrow{margin-bottom:20px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,5vw,3.5rem);
    line-height:1.05;margin:0 0 20px;text-wrap:balance;max-width:17ch}
  .lead{font-size:1.08rem;color:var(--muted);max-width:62ch;margin:0}
  .hero .rule{width:64px;height:4px;background:var(--amber);border-radius:2px;margin:26px 0 0}
  .hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .hero-cta .btn{padding:10px 18px;font-size:.9rem}

  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:40px 0 4px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 14px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--serif);font-size:1.9rem;font-weight:600;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1}
  .stat .l{font-size:.72rem;color:var(--muted);margin-top:7px;letter-spacing:.02em}
  @media(max-width:1240px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:460px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* ---------- sections ---------- */
  section{padding:60px 0}
  .band{background:var(--card-2);border-block:1px solid var(--line)}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px}
  .sec-head .idx{font-family:var(--mono);font-size:.78rem;color:var(--amber);letter-spacing:.1em;padding-top:6px}
  .sec-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,3vw,2.1rem);margin:0;text-wrap:balance}
  .sec-head p{margin:6px 0 0;color:var(--muted);font-size:.96rem;max-width:56ch}

  .flow{display:grid;grid-template-columns:repeat(7,1fr);position:relative}
  .flow::before{content:"";position:absolute;left:5%;right:5%;top:26px;height:2px;
    background:linear-gradient(90deg,var(--teal),var(--teal-2));opacity:.35}
  .step{text-align:center;padding:0 6px;position:relative;text-decoration:none;border-radius:12px}
  .step .dot{width:52px;height:52px;border-radius:50%;background:var(--card);border:2px solid var(--teal);
    color:var(--teal);font-family:var(--serif);font-weight:700;font-size:1.2rem;display:grid;place-items:center;
    margin:0 auto 12px;position:relative;z-index:1;box-shadow:var(--shadow);transition:transform .18s}
  .step:hover .dot{transform:scale(1.08);background:var(--teal-soft)}
  .step:last-child .dot{background:var(--teal);color:#fff}
  .step h4{font-size:.82rem;margin:0 0 4px;font-weight:700}
  .step:hover h4{color:var(--teal)}
  .step p{font-size:.72rem;color:var(--muted);margin:0;line-height:1.35}
  @media(max-width:900px){.flow{grid-template-columns:1fr 1fr;gap:22px 10px}.flow::before{display:none}}

  .group-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--teal);margin:36px 0 16px;display:flex;align-items:center;gap:12px}
  .group-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .mod{display:block;text-decoration:none;position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px 18px 18px;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
  .mod:hover{transform:translateY(-3px);border-color:var(--teal)}
  .mod .num{font-family:var(--mono);font-size:.72rem;color:var(--amber);letter-spacing:.08em}
  .mod h3{font-family:var(--serif);font-weight:600;font-size:1.08rem;margin:8px 0 8px;line-height:1.2}
  .mod p{font-size:.82rem;color:var(--muted);margin:0}
  .mod .tag{display:inline-block;margin-top:12px;font-size:.7rem;font-family:var(--mono);
    color:var(--teal);background:var(--teal-soft);border-radius:20px;padding:3px 10px}
  .mod .go{position:absolute;right:16px;bottom:16px;color:var(--teal);opacity:0;transform:translateX(-4px);transition:.18s}
  .mod:hover .go{opacity:1;transform:none}

  .comp{display:grid;grid-template-columns:1fr 1fr;gap:8px 40px}
  @media(max-width:760px){.comp{grid-template-columns:1fr}}
  .crow{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .crow .name{flex:1;font-size:.9rem}
  .stars{font-family:var(--mono);letter-spacing:2px;color:var(--star);font-size:1rem;white-space:nowrap}
  .stars .e{color:var(--star-empty)}
  .comp-cta{margin-top:24px}

  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:9px 16px;font-size:.85rem;
    box-shadow:var(--shadow);text-decoration:none;transition:border-color .15s,transform .15s}
  .chip:hover{border-color:var(--teal);transform:translateY(-2px)}
  .chip b{color:var(--teal);font-weight:700}

  .formats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.formats{grid-template-columns:1fr}}
  .fmt{display:block;text-decoration:none;border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:var(--card-2);transition:border-color .15s}
  .fmt:hover{border-color:var(--teal)}
  .fmt .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
  .fmt h3{font-family:var(--serif);font-weight:600;margin:8px 0 8px;font-size:1.15rem}
  .fmt p{margin:0;font-size:.85rem;color:var(--muted)}
  .fmt .path{margin-top:14px;font-family:var(--mono);font-size:.72rem;color:var(--teal);
    background:var(--teal-soft);border-radius:8px;padding:8px 10px;word-break:break-all}

  .ref-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px;font-size:.8rem;color:var(--muted)}
  .ref-strip b{font-weight:600;color:var(--teal);background:var(--teal-soft);border-radius:20px;padding:4px 12px}
  .callout{background:linear-gradient(135deg,#0b4f55,#0e6b6f);color:#fff;border-radius:20px;
    padding:40px 36px;position:relative;overflow:hidden}
  .callout::before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
  .callout .eyebrow{color:#f5e8d3}
  .callout h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,3vw,2rem);margin:0 0 12px;max-width:26ch;text-wrap:balance;color:#fff}
  .callout p{margin:0;max-width:62ch;opacity:.92;font-size:1rem}

  footer{border-top:1px solid var(--line);padding:30px 0 calc(50px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.82rem}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}

  /* ---------- pages module / fiche ---------- */
  .page{padding-top:26px;padding-bottom:70px}
  .crumbs{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:26px}
  .crumbs a{text-decoration:none}.crumbs a:hover{color:var(--teal);text-decoration:underline}
  .crumbs .sep{opacity:.6}
  .mhead{display:flex;gap:22px;align-items:flex-start;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
  .mnum{font-family:var(--serif);font-size:3.4rem;font-weight:600;line-height:.9;color:var(--teal);
    border-right:3px solid var(--amber);padding-right:20px}
  .mhead h1,.dhead h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.12;margin:0 0 10px;text-wrap:balance}
  .mstats{margin-top:14px;font-size:.8rem;color:var(--muted)}
  @media(max-width:560px){.mhead{flex-direction:column;gap:12px}.mnum{border-right:0;border-bottom:3px solid var(--amber);padding:0 0 8px}}

  .dlist{display:grid;gap:14px}
  .dcard{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);transition:border-color .15s}
  .dcard:hover{border-color:var(--teal)}
  .dcard-main{flex:1;display:flex;gap:16px;align-items:flex-start;text-decoration:none;min-width:0}
  .dcard-ic{width:46px;height:46px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;font-size:1.4rem;flex:none}
  .dcard-ic.xl{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--teal)}
  .dcard h3{font-family:var(--serif);font-weight:600;font-size:1.12rem;margin:0 0 4px;line-height:1.25}
  .dcard a.dcard-main:hover h3{color:var(--teal)}
  .dcard p{margin:0;font-size:.85rem;color:var(--muted)}
  .dcard .meta{margin-top:8px;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
  .dcard-act{display:flex;gap:8px;flex:none}
  @media(max-width:640px){.dcard{flex-direction:column;align-items:stretch}.dcard-act{padding-left:62px}}

  .pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:48px}
  .pager a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);font-weight:600;font-size:.9rem}
  .pager a:hover{border-color:var(--teal);color:var(--teal)}
  .pager small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);font-family:var(--mono);margin-bottom:3px}
  .pager .nx{text-align:right}
  @media(max-width:560px){.pager{grid-template-columns:1fr}.pager .nx{text-align:left}}

  .docpage{max-width:1220px}
  .doclayout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:48px;align-items:start}
  .doclayout:not(:has(.toc)){grid-template-columns:minmax(0,1fr)}
  .doc{max-width:820px;min-width:0}
  .dhead{padding-bottom:22px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .dhead .dic{margin-right:12px}
  .dactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .toc{position:sticky;top:calc(var(--top) + 24px);max-height:calc(100vh - var(--top) - 48px);overflow:auto;
    border-left:1px solid var(--line);padding:4px 0 4px 16px;font-size:.8rem}
  .toc-t{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .toc a{display:block;text-decoration:none;color:var(--muted);padding:4px 0 4px 10px;margin-left:-17px;border-left:2px solid transparent;line-height:1.35}
  .toc a:hover{color:var(--teal)}
