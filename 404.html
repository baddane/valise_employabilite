<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Valise de l'expert en employabilité</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b4f55'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%23e0a850'/%3E%3Crect x='8' y='16' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:light;--ink:#12211f;--paper:#f4f6f5;--card:#fff;--line:#d8e0dd;--muted:#5a6b67;--teal:#0b4f55;--amber:#b9791f}
  @media (prefers-color-scheme:dark){
    :root{color-scheme:dark;--ink:#e7efed;--paper:#0c1615;--card:#132220;--line:#25403c;--muted:#9fb2ad;--teal:#4fb9b6;--amber:#e0a850}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
  .box{max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;
    box-shadow:0 1px 2px rgba(16,40,38,.06),0 8px 24px rgba(16,40,38,.06)}
  .mk{width:34px;height:34px;border-radius:9px;background:var(--teal);position:relative;margin-bottom:18px}
  .mk::after{content:"";position:absolute;left:8px;right:8px;top:10px;height:4px;border-radius:2px;background:var(--amber)}
  .mk::before{content:"";position:absolute;left:8px;right:8px;top:19px;height:4px;border-radius:2px;background:#fff;opacity:.85}
  h1{font-size:1.35rem;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 20px}
  .btn{display:inline-block;text-decoration:none;background:var(--teal);color:var(--paper);
    border-radius:9px;padding:10px 18px;font-weight:600}
  .btn:hover{opacity:.9}
</style>
</head>
<body>
  <main class="box">
    <div class="mk" aria-hidden="true"></div>
    <h1>Page introuvable</h1>
    <p>Cette adresse ne correspond à aucune fiche de la valise. Le lien est peut-être obsolète ou mal recopié.</p>
    <a class="btn" href="/">Retour à la valise</a>
  </main>
</body>
</html>
